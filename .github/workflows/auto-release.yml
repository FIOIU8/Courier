name: Auto Release

on:
  schedule:
    - cron: '0 0 */3 * *'  # RELEASE_CRON_MARKER
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  read-config:
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.config.outputs.prerelease }}
    steps:
      - name: Sparse checkout of release config
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: |
            .release-config.yml

      - name: Read release config
        id: config
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $prerelease = 'false'
          if (Test-Path '.release-config.yml') {
            $content = Get-Content '.release-config.yml' -Raw
            if ($content -match 'prerelease:\s*true') {
              $prerelease = 'true'
            }
          }
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT

  release:
    needs: read-config
    uses: ./.github/workflows/release-core.yml
    with:
      release_type: 'auto'
      prerelease: ${{ needs.read-config.outputs.prerelease == 'true' }}
      make_latest: ${{ needs.read-config.outputs.prerelease != 'true' }}
