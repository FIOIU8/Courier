name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: '发布类型'
        required: true
        type: choice
        options:
          - auto
          - manual
        default: 'manual'
      prerelease:
        description: '标记为 Pre-release'
        required: false
        type: boolean
        default: false
      make_latest:
        description: '设为最新版本'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Build and publish release
    uses: ./.github/workflows/release-core.yml
    with:
      release_type: ${{ github.event.inputs.release_type }}
      prerelease: ${{ github.event.inputs.prerelease == 'true' }}
      make_latest: ${{ github.event.inputs.make_latest == 'true' }}
