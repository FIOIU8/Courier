name: courier_flutter
description: "Courier AI 代码编辑器 - Flutter 桌面端"
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  ffi: ^2.2.0
  provider: ^6.1.2
  go_router: ^17.4.0
  window_manager: ^0.5.2
  path: ^1.9.0
  file_selector: ^1.1.0
  shared_preferences: ^2.3.2
  simple_secure_storage: ^0.4.2
  package_info_plus: ^10.2.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
